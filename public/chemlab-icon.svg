<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="flaskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="liquidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Dark Rounded Container -->
  <rect width="64" height="64" rx="16" fill="#020617" />
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="#06b6d4" stroke-opacity="0.4" stroke-width="1.5" />

  <!-- Erlenmeyer Flask Body -->
  <g filter="url(#cyanGlow)">
    <!-- Flask Outline -->
    <path d="M28 14 L36 14 L36 24 L48 46 C50 50 47 54 42 54 L22 54 C17 54 14 50 16 46 L28 24 Z"
          fill="#0f172a" stroke="url(#flaskGrad)" stroke-width="2.5" stroke-linejoin="round" />

    <!-- Chemical Liquid -->
    <path d="M21 40 L43 40 L46.5 46.5 C47.5 48.5 46 51 43.5 51 L20.5 51 C18 51 16.5 48.5 17.5 46.5 Z"
          fill="url(#liquidGrad)" />

    <!-- Bubbles -->
    <circle cx="28" cy="45" r="1.5" fill="#ffffff" opacity="0.8" />
    <circle cx="35" cy="43" r="2" fill="#ffffff" opacity="0.9" />
    <circle cx="32" cy="36" r="1.2" fill="#22d3ee" opacity="0.7" />
  </g>
</svg>
